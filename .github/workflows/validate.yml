name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Матрица не декоративна. Инструменты плагина запускаются тем `node`, что стоит у
    # пользователя, и на разных парах «ОС + версия» ведут себя по-разному: fs.rmSync в
    # Node 23/24 на Windows МОЛЧА не удаляет пути с не-ASCII символами (nodejs/node#61067),
    # а кириллица в имени проекта 1С — норма. Прогон только на ubuntu+20 такой отказ не видит.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "24"]
        include:
          # Канареечный прогон, а не поддержка старой версии. Спецификация "24" выше даёт
          # свежую сборку (на момент добавления — 24.19.0), где апстрим дефект уже исправил,
          # и регрессию НАШЕГО кода такая комбинация не поймает: проверять там нечего.
          # На 24.12.0 дефект живой — замерено на этой матрице: с удалением состояния,
          # возвращённым на rmSync, падают ровно три проверки, включая боевой симптом
          # «release ... code=0, pending=true». Пока комбинация здесь, возврат к rmSync
          # виден сразу. Если сборка 24.12.0 когда-нибудь исчезнет из доступных — заменить
          # на любую другую из диапазона 23.0–24.12, а не удалять проверку молча.
          - os: windows-latest
            node: "24.12.0"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Единый синтаксис шагов на обеих ОС: на windows-latest оболочка по умолчанию — pwsh.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Валидаторы XML держатся на lxml. Без него они падают с ModuleNotFoundError, а тесты
      # уходят в пропуск — контур xml остаётся непроверенным при зелёном прогоне.
      - name: Зависимости валидаторов XML
        run: pip install --disable-pip-version-check "lxml==6.1.1"

      - name: Целостность пакета
        run: node tools/validate-package.mjs

      - name: Синтаксис валидаторов XML
        run: python -m compileall -q tools/xml

      - name: Производная карта признаков синхронна с источником
        run: |
          node tools/gen-signs-map-md.mjs
          git diff --exit-code skills/bsl-architecture-review/references/signs-map.md \
            || { echo "signs-map.md устарел — перегенерируй: node tools/gen-signs-map-md.mjs"; exit 1; }

      - name: Тесты программных проверок
        run: node tests/run-tests.mjs
