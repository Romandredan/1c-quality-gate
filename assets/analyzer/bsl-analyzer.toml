# Гейтовый конфиг bsl-analyzer.
#
# Проектный `bsl-analyzer.toml` продолжает править IDE, этот правит гейтом. Разделение
# намеренное: пороги проекта принадлежат проекту, но гейт не может от них зависеть — иначе
# отключённая в проекте диагностика делает гейт тише, и об этом никто не узнает.
#
# Отключено ровно то, что не влияет на поведение кода: форматирование и типографика.
# Причина не в том, что это неважно, а в том, что на одном модуле типового кода такие
# замечания дают сотни строк и топят содержательные находки. Гигиену файлов у нас закрывает
# отдельный контур (`file-hygiene`), а не статический анализатор.
#
# Вернуть любое правило можно в проектном конфиге — он накладывается поверх.

[diagnostics.parameters]
LineLength = false
MissingSpace = false
SpaceAtStartComment = false
ConsecutiveEmptyLines = false
IncorrectLineBreak = false
SemicolonPresence = false
YoLetterUsage = false
Typo = false

# Отдельный случай: не шум, а ложное срабатывание на идиоматичном коде 1С.
# `ВызватьHTTPМетод`, `ДобавитьCookieВХранилище`, `ZipРазмерLFH` — корректные имена, и
# отличить их от подмены похожими символами (о/o, е/e) диагностика не умеет. Оставлять её
# включённой значит писать в след `verdict=violation` по коду, который чинить не надо, —
# а ложная находка вреднее пропущенной: после двух-трёх таких проверку отключают целиком.
#
# Потеря невелика: настоящая подмена символа даёт неразрешимый идентификатор, и его ловят
# точные диагностики `UnresolvedMethodCall` / `UnresolvedField`, которые остаются включёнными.
LatinAndCyrillicSymbolInWord = false

# `TypeMismatchByDocComment` (несоответствие типа фактического значения типу из шапки метода)
# выключена в самом движке, и мы её НЕ включаем. Замер на расширении из 36 модулей: 17 находок,
# из них содержательные («ожидалось 'Массив', получено 'Соответствие'», «ожидалось 'Структура',
# получено 'Структура | Неопределено'» — шапка не назвала Неопределено у необязательного
# параметра) соседствуют с ложными: «ожидалось 'УзелDOM', получено 'ЭлементDOM'» — иерархию
# типов платформы диагностика не учитывает, а ЭлементDOM и есть УзелDOM.
#
# Причина отказа та же, что у LatinAndCyrillicSymbolInWord выше: ложная находка вреднее
# пропущенной. Вернуть стоит, когда движок научится наследованию типов.

# `AmbiguousFieldInQuery` (неоднозначное поле в запросе) — появилась в 0.2.72, выключена
# по замеру. На корпусе из 416 модулей боевых расширений она дала четыре находки уровня
# `critical`, и все четыре — на `УПОРЯДОЧИТЬ ПО` с голым именем, которое объявлено
# псевдонимом выборки того же запроса. Разрешать имя в `УПОРЯДОЧИТЬ ПО` по таблицам-
# источникам вместо псевдонимов результата — ошибка самой диагностики; в одном из случаев
# псевдоним стоит над выражением `ЕСТЬNULL(Х.Ссылка, Н.Ссылка) КАК Ссылка`, и совет
# «укажите источник явно» выполнить попросту нечем.
#
# Потеря невелика: настоящую неоднозначность платформа ловит сама и громко — такой запрос
# падает на `Выполнить()` при первом же прогоне и до гейта не доживает. На работающем коде
# выход диагностики — почти чистый ложный `critical`, а он в следе становится
# `verdict=violation`. Вернуть стоит, когда разрешение имён в `УПОРЯДОЧИТЬ ПО` начнёт
# отдавать приоритет псевдонимам результата.
AmbiguousFieldInQuery = false

# `UnresolvedBareCall` (вызов неопределённой процедуры или функции без получателя) — появилась
# в 0.3.0, выключена по замеру. На рабочем проекте с 17 расширениями она дала 29 находок уровня
# `major`, все в расширениях, и проверенные оказались ложными: вызов собственного метода
# модуля расширения из блока `#Вставка` метода с `&ИзменениеИКонтроль` не разрешается, хотя
# метод определён в том же модуле. Это штатный способ доработки типового метода, поэтому
# находка попадала бы ровно в изменённые строки, и гейт требовал бы `verdict=violation` по
# работающему коду.
#
# Потеря невелика: неопределённый вызов платформа не компилирует, и расширение с таким модулем
# не применяется — ошибка видна при первой же загрузке. Вернуть стоит, когда движок начнёт
# разрешать имена в `#Вставка` по контексту модуля расширения.
UnresolvedBareCall = false
